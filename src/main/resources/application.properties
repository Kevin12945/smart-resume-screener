spring.application.name=smart-resume-screener
server.port=8080

# H2 file-based database (no external DB setup needed to run/evaluate)
spring.datasource.url=jdbc:h2:file:./data/screener;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Google Gemini API settings (free tier, no credit card required)
# Get a key at https://aistudio.google.com/apikey and set it as an environment variable:
#   export GEMINI_API_KEY=AIza...
llm.provider=gemini
llm.gemini.api-key=${GEMINI_API_KEY:}
llm.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models
llm.gemini.model=gemini-3.6-flash
