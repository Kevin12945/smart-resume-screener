spring.application.name=smart-resume-screener
server.port=8080

# H2 file-based database (no external DB setup needed to run/evaluate)
spring.datasource.url=jdbc:h2:file:./data/screener;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Groq API settings (free tier, no credit card required)
# Get a key at https://console.groq.com/keys and set it as an environment variable:
#   export GROQ_API_KEY=gsk_...
llm.provider=groq
llm.groq.api-key=${GROQ_API_KEY:}
llm.groq.base-url=https://api.groq.com/openai/v1/chat/completions
llm.groq.model=openai/gpt-oss-120b